version: "3"

agent:
    authtoken: <INSERT_NGROK_TOKEN>
    console_ui_color: transparent

tunnels:
    control:
        proto: http
        hostname: leeandher.ngrok.io
        addr: 8000
        host_header: "rewrite"
    us:
        proto: http
        hostname: us.leeandher.ngrok.io
        addr: 8010
        host_header: "rewrite"
    acme-frontend:
        proto: http
        hostname: frontend-leeandher.ngrok.io
        addr: 3000
    acme-backend-py:
        proto: http
        hostname: backend-py-leeandher.ngrok.io
        addr: 5100
    acme-backend-ts:
        proto: http
        hostname: backend-ts-leeandher.ngrok.io
        addr: 5200

